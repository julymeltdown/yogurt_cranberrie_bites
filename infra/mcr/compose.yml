# Reproducible BE44 real-stack composition: seven services, PostgreSQL and Redis.
# Secrets are never baked here: every value arrives through MCR_ENV_FILE, a private
# file generated by scripts/mcr/backend-smoke.sh (or an operator's isolated env file).
# Host ports stay on 127.0.0.1 and are selected by the smoke script.
name: mcr

x-app: &app
  image: ${MCR_STACK_IMAGE:-mcr-stack:local}
  env_file:
    - ${MCR_ENV_FILE:?set MCR_ENV_FILE to a private generated env file}
  restart: "no"
  init: true
  depends_on:
    postgres:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

x-healthcheck: &healthcheck
  interval: 2s
  timeout: 2s
  retries: 60
  start_period: 5s

services:
  postgres:
    image: postgres:16.14-bookworm
    environment:
      POSTGRES_USER: mcr_owner
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${MCR_DB_PASSWORD:?set MCR_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-mcr-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcr_owner -d postgres"]
      <<: *healthcheck
    ports:
      - "127.0.0.1:${MCR_POSTGRES_HOST_PORT:-15432}:5432"

  redis:
    image: redis:7.4-bookworm
    environment:
      MCR_REDIS_PASSWORD: ${MCR_REDIS_PASSWORD:?set MCR_REDIS_PASSWORD}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${MCR_REDIS_PASSWORD:?set MCR_REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$MCR_REDIS_PASSWORD\" ping | grep -q PONG"]
      <<: *healthcheck
    ports:
      - "127.0.0.1:${MCR_REDIS_HOST_PORT:-16379}:6379"

  migrate:
    image: ${MCR_STACK_IMAGE:-mcr-stack:local}
    build:
      context: ../..
      dockerfile: infra/mcr/backend/stack.Dockerfile
      args:
        CARGO_BUILD_JOBS: ${MCR_BUILD_JOBS:-3}
    env_file:
      - ${MCR_ENV_FILE:?set MCR_ENV_FILE to a private generated env file}
    entrypoint: ["/bin/sh", "/usr/local/bin/migrate-all.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api-gateway:
    <<: *app
    command: ["api-gateway"]
    environment:
      GATEWAY_RUNTIME_MODE: parity
      GATEWAY_DATABASE_MIGRATION_MODE: external
      GATEWAY_SEED_ENABLED: "false"
      GATEWAY_DATABASE_URL: postgresql://mcr_owner:${MCR_DB_PASSWORD:?}@postgres:5432/mcr_api_gateway?sslmode=disable
      GATEWAY_HTTP_ADDR: 0.0.0.0:8080
      GATEWAY_GRPC_ADDR: 0.0.0.0:50050
      GATEWAY_METRICS_ADDR: 0.0.0.0:9090
      GATEWAY_AUTH_GRPC_ENDPOINT: http://auth-service:50051
      GATEWAY_PROFILE_GRPC_ENDPOINT: http://profile-service:50052
      GATEWAY_FRIEND_GRPC_ENDPOINT: http://friend-service:50053
      GATEWAY_POST_GRPC_ENDPOINT: http://post-service:50054
      GATEWAY_NOTIFICATION_GRPC_ENDPOINT: http://notification-service:50055
      GATEWAY_CONCERT_GRPC_ENDPOINT: http://concert-service:50056
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      auth-service:
        condition: service_started
      profile-service:
        condition: service_started
      friend-service:
        condition: service_started
      post-service:
        condition: service_started
      notification-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9090/livez"]
      <<: *healthcheck
    ports:
      - "127.0.0.1:${MCR_GATEWAY_HOST_PORT:-18080}:8080"
      - "127.0.0.1:${MCR_GATEWAY_METRICS_HOST_PORT:-19090}:9090"

  auth-service:
    <<: *app
    command: ["auth-service"]
    environment:
      AUTH_RUNTIME_MODE: parity
      AUTH_DATABASE_MIGRATION_MODE: external
      AUTH_SEED_ENABLED: "false"
      AUTH_DATABASE_URL: postgresql://mcr_owner:${MCR_DB_PASSWORD:?}@postgres:5432/mcr_auth?sslmode=disable
      AUTH_HTTP_ADDR: 0.0.0.0:8081
      AUTH_GRPC_ADDR: 0.0.0.0:50051
      AUTH_METRICS_ADDR: 0.0.0.0:9091
      AUTH_PROFILE_GRPC_ENDPOINT: http://profile-service:50052
      AUTH_FRIEND_GRPC_ENDPOINT: http://friend-service:50053
      AUTH_POST_GRPC_ENDPOINT: http://post-service:50054
      AUTH_NOTIFICATION_GRPC_ENDPOINT: http://notification-service:50055
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9091/livez"]
      <<: *healthcheck
    ports:
      - "127.0.0.1:${MCR_AUTH_METRICS_HOST_PORT:-19091}:9091"

  profile-service:
    <<: *app
    command: ["profile-service"]
    environment:
      PROFILE_RUNTIME_MODE: parity
      PROFILE_DATABASE_MIGRATION_MODE: external
      PROFILE_SEED_ENABLED: "false"
      PROFILE_DATABASE_URL: postgresql://mcr_owner:${MCR_DB_PASSWORD:?}@postgres:5432/mcr_profile?sslmode=disable
      PROFILE_HTTP_ADDR: 0.0.0.0:8082
      PROFILE_GRPC_ADDR: 0.0.0.0:50052
      PROFILE_METRICS_ADDR: 0.0.0.0:9092
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9092/livez"]
      <<: *healthcheck
    ports:
      - "127.0.0.1:${MCR_PROFILE_METRICS_HOST_PORT:-19092}:9092"

  friend-service:
    <<: *app
    command: ["friend-service"]
    environment:
      FRIEND_RUNTIME_MODE: parity
      FRIEND_DATABASE_MIGRATION_MODE: external
      FRIEND_SEED_ENABLED: "false"
      FRIEND_DATABASE_URL: postgresql://mcr_owner:${MCR_DB_PASSWORD:?}@postgres:5432/mcr_friend?sslmode=disable
      FRIEND_HTTP_ADDR: 0.0.0.0:8083
      FRIEND_GRPC_ADDR: 0.0.0.0:50053
      FRIEND_METRICS_ADDR: 0.0.0.0:9093
      FRIEND_PROFILE_GRPC_ENDPOINT: http://profile-service:50052
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9093/livez"]
      <<: *healthcheck
    ports:
      - "127.0.0.1:${MCR_FRIEND_METRICS_HOST_PORT:-19093}:9093"

  post-service:
    <<: *app
    command: ["post-service"]
    environment:
      POST_RUNTIME_MODE: parity
      POST_DATABASE_MIGRATION_MODE: external
      POST_SEED_ENABLED: "false"
      POST_DATABASE_URL: postgresql://mcr_owner:${MCR_DB_PASSWORD:?}@postgres:5432/mcr_post?sslmode=disable
      POST_HTTP_ADDR: 0.0.0.0:8084
      POST_GRPC_ADDR: 0.0.0.0:50054
      POST_METRICS_ADDR: 0.0.0.0:9094
      POST_PROFILE_GRPC_ENDPOINT: http://profile-service:50052
      POST_FRIEND_GRPC_ENDPOINT: http://friend-service:50053
      POST_NOTIFICATION_GRPC_ENDPOINT: http://notification-service:50055
      POST_GATEWAY_GRPC_ENDPOINT: http://api-gateway:50050
      POST_REDIS_URL: redis://:${MCR_REDIS_PASSWORD:?}@redis:6379/0
      POST_EXTERNAL_PUBLISHER: disabled
      POST_KAFKA_BOOTSTRAP_BROKERS: ""
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9094/livez"]
      <<: *healthcheck
    ports:
      - "127.0.0.1:${MCR_POST_METRICS_HOST_PORT:-19094}:9094"

  notification-service:
    <<: *app
    command: ["notification-service"]
    environment:
      NOTIFICATION_RUNTIME_MODE: parity
      NOTIFICATION_DATABASE_MIGRATION_MODE: external
      NOTIFICATION_SEED_ENABLED: "false"
      NOTIFICATION_DATABASE_URL: postgresql://mcr_owner:${MCR_DB_PASSWORD:?}@postgres:5432/mcr_notification?sslmode=disable
      NOTIFICATION_HTTP_ADDR: 0.0.0.0:8085
      NOTIFICATION_GRPC_ADDR: 0.0.0.0:50055
      NOTIFICATION_METRICS_ADDR: 0.0.0.0:9095
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9095/livez"]
      <<: *healthcheck
    ports:
      - "127.0.0.1:${MCR_NOTIFICATION_METRICS_HOST_PORT:-19095}:9095"

  # Concert runs its health-only operational mode: the product gRPC/release
  # composition requires an operator release bundle this stack does not ship.
  # Its database migrations, health and readiness are real; product RPCs stay
  # unavailable and are never simulated as success.
  concert-service:
    <<: *app
    command: ["concert-service"]
    environment:
      CONCERT_RUNTIME_MODE: production
      CONCERT_MIGRATION_MODE: external
      CONCERT_DATABASE_URL: postgresql://mcr_owner:${MCR_DB_PASSWORD:?}@postgres:5432/mcr_concert?sslmode=disable
      CONCERT_METRICS_ADDR: 0.0.0.0:9096
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9096/livez"]
      <<: *healthcheck
    ports:
      - "127.0.0.1:${MCR_CONCERT_METRICS_HOST_PORT:-19096}:9096"

volumes:
  postgres-data:
  redis-data:
