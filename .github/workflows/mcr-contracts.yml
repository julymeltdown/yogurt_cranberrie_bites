name: MCR contract generation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.3'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.2'
      - run: python -m pip install -r scripts/mcr/requirements-contracts.txt
      - run: corepack enable && corepack pnpm --dir frontend install --frozen-lockfile
      - name: Existing full QA01 coverage and negative probes
        run: |
          python -B scripts/mcr/contracts/qa01-coverage/run.py
          python -B scripts/mcr/contracts/qa01-coverage/test_coverage.py
      - name: Reproducibility, deliberate schema mismatch, full C07 compatibility
        run: >-
          python -B scripts/mcr/contracts/c07/run.py
          --node "$(command -v node)"
          --dependencies "$GITHUB_WORKSPACE/frontend/node_modules"
          --artifacts "$RUNNER_TEMP/mcr-c07"
