image.workspace = true
notification-service = { path = "../../services/notification-service" }
platform = { path = "../../crates/platform" }
post-service = { path = "../../services/post-service" }
profile-service = { path = "../../services/profile-service" }
redis.workspace = true
reqwest = { workspace = true, features = ["multipart"] }
