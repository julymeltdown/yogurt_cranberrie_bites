[package]
name = "full-stack-e2e"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow.workspace = true
api-gateway = { path = "../../services/api-gateway" }
auth-service = { path = "../../services/auth-service" }
axum.workspace = true
chrono.workspace = true
friend-service = { path = "../../services/friend-service" }
