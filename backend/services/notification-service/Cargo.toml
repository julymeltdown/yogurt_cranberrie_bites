[package]
name = "notification-service"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "notification_service"
path = "src/lib.rs"

[[bin]]
name = "notification-service"
path = "src/main.rs"

[dependencies]
concert-domain = { path = "../../crates/concert-domain" }
concert-application = { path = "../../crates/concert-application" }
migration-runtime = { path = "../../crates/migration-runtime" }
notification-domain = { path = "../../crates/notification-domain" }
notification-application = { path = "../../crates/notification-application" }
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
chrono.workspace = true
platform = { path = "../../crates/platform" }
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[build-dependencies]
contracts-build = { path = "../../crates/contracts-build" }
protoc-bin-vendored = "3.1.0"
tonic-prost-build.workspace = true

[dev-dependencies]
tokio-stream = { workspace = true, features = ["net"] }
proptest.workspace = true
testcontainers.workspace = true
testcontainers-modules.workspace = true
test-support = { path = "../../crates/test-support" }
