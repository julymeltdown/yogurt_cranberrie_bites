syntax = "proto3";
package concert.participant.v1;
import "concert/v1/product.proto";

// Gateway-only signed internal envelope. Public DTOs remain frozen C03 JSON.
// Workload/actor delegation signs this complete message and the exact RPC path.
// This envelope is a bounded transport assertion, NEVER a mutation capability.
message ParticipantRequest {
  string user_id = 1;
  string event_id = 2;
  string session_family_id = 3;
  string request_id = 4;
  string http_method = 5;
  string http_target = 6;
  bytes request_json = 7; // Empty for GET. Exact unmodified browser body for writes.
  string release_digest = 8; // Current validated release SHA-256, 64 lowercase hex.
  int64 authority_expires_unix_micros = 9; // Original bound, never renewed here.
  int64 auth_observed_at_unix_micros = 10;
  int64 profile_observed_at_unix_micros = 11;
}
message ParticipantResponse {
  // GetParticipant/UpdatePreferences: PrivateParticipant; SetAvatar: AvatarState.
  bytes response_json = 1;
  concert.product.v1.ResponseDelivery delivery = 2; // Internal; never public JSON/headers.
  ParticipantFailure failure = 3; // Mutually exclusive with response_json.
}
// Closed sanitized error envelope after delivery publication. No diagnostic,
// private payload, or caller-selected text crosses this internal boundary.
message ParticipantFailure { uint32 grpc_code = 1; string core_reason = 2; }
service ConcertParticipantService {
  rpc GetParticipant(ParticipantRequest) returns (ParticipantResponse);
  rpc SetAvatar(ParticipantRequest) returns (ParticipantResponse);
  // Full C03 PATCH; selected canonical Profile fields use the SELF coordinator.
  rpc UpdatePreferences(ParticipantRequest) returns (ParticipantResponse);
}

// Profile-only recovery query. A fresh bounded signed query can inspect ONLY an
// existing exact durable operation; it cannot create, decide or retry a write.
message ParticipantDecisionRequest {
  string actor_id = 1;
  string event_id = 2;
  string session_family_id = 3;
  string operation_id = 4;
  bytes parent_digest = 5;
  bytes body_digest = 6;
  bytes guard_binding_digest = 7;
  string profile_prepared_gid = 8;
  bytes profile_effect_digest = 9;
  int64 authority_expires_unix_micros = 10;
}
enum ParticipantDecision {
  PARTICIPANT_DECISION_UNSPECIFIED = 0;
  UNRESOLVED = 1;
  COMMIT = 2;
  ABORT = 3;
}
message ParticipantDecisionTransaction {
  string system_identifier = 1;
  uint32 database_oid = 2;
  string full_xid = 3;
  int32 backend_pid = 4;
  int64 backend_started_unix_micros = 5;
}
message ParticipantDecisionResponse {
  ParticipantDecisionRequest query = 1;
  ParticipantDecision decision = 2;
  ParticipantDecisionTransaction concert_transaction = 3;
  int64 committed_revision = 4; // Nonzero only for an authoritative COMMIT.
}
service ConcertParticipantDecisionService {
  rpc ResolveDecision(ParticipantDecisionRequest) returns (ParticipantDecisionResponse);
}
