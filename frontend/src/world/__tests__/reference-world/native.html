<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reference world · fixture qualification</title>
<style>body{margin:0;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:#191817;color:#f2eada;font:13px/1.3 ui-monospace,monospace}header{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;box-sizing:border-box;flex:none}#era{height:44px;display:flex;flex:none}button{min-height:44px;min-width:44px;font:inherit}#era button{flex:1;background:#eee5d5;color:#211d19;border:1px solid #211d19}#era button[aria-pressed=true]{background:#29221e;color:#fff5e6}#viewport{position:relative;flex:1 0 120px;min-height:120px;overflow:hidden}#host,#controls{position:absolute;inset:0}canvas{display:block}footer{height:44px;display:flex;align-items:center;padding:0 8px;flex:none}#panel{position:absolute;inset:0;background:#eee5d5;color:#211d19;padding:8px;z-index:3}#panel[hidden]{display:none}#fixture-status{font-size:11px;max-width:240px}</style>
